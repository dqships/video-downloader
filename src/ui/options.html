<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vidzilla settings</title>
    <link rel="stylesheet" href="design/tokens.css" />
    <link rel="stylesheet" href="design/components.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="vz-page">
    <header class="vz-page-head">
      <svg class="vz-popup-mark" viewBox="4 14 88 76.21" aria-hidden="true">
        <path fill="currentColor" d="M4 14H92L62.89 64.43L48 38.64L33.11 64.43Z" />
        <path fill="currentColor" d="M48 48.64L60 69.43L48 90.21L36 69.43Z" />
      </svg>
      <h1 class="vz-page-title">vidzilla</h1>
    </header>

    <section class="vz-section" aria-labelledby="settings-title">
      <div class="vz-section-head">
        <h2 id="settings-title" class="vz-section-title">Saving</h2>
        <p class="vz-field-help vz-settings-saved" aria-live="polite"></p>
      </div>
      <form class="vz-fields vz-settings-form">
        <!-- settings-fields -->
      </form>
    </section>

    <section class="vz-section" id="saved-files" aria-labelledby="history-title">
      <div class="vz-section-head">
        <h2 id="history-title" class="vz-section-title">Saved files</h2>
        <button id="clear" class="vz-btn vz-btn--quiet vz-btn--small" type="button"></button>
      </div>
      <ol id="history" class="vz-history"></ol>
      <p id="history-empty" class="vz-field-help" hidden>Nothing saved yet. Files you save with Vidzilla show up here.</p>
    </section>

    <template id="history-row">
      <li class="vz-history-row">
        <div class="vz-thumb"></div>
        <div class="vz-history-body">
          <p class="vz-history-title"></p>
          <p class="vz-history-file"></p>
          <p class="vz-history-meta vz-edge"></p>
        </div>
        <div class="vz-frame-actions">
          <button class="vz-icon-btn show" type="button" title="Show in folder"></button>
          <a class="vz-icon-btn page" target="_blank" rel="noopener" title="Open the page it came from"></a>
          <button class="vz-icon-btn remove" type="button" title="Remove from list"></button>
        </div>
      </li>
    </template>
    <script type="module" src="options.js"></script>
  </body>
</html>
